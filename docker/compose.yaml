name: gomad

x-app: &app
  build:
    context: ..
    dockerfile: docker/php/Dockerfile
    network: host
    args:
      UID: ${LOCAL_UID:-1000}
      GID: ${LOCAL_GID:-1000}
  working_dir: /var/www/html
  env_file:
    - path: ../.env
      required: false
  environment: &app-environment
    APP_NAME: GoMad
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:8200
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-gomad}
    DB_USERNAME: ${DB_USERNAME:-gomad}
    DB_PASSWORD: ${DB_PASSWORD:-gomad-local}
    SESSION_DRIVER: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    MAIL_FROM_ADDRESS: hello@gomad.local
    MAIL_FROM_NAME: GoMad
    BACKUP_DIRECTORY: /backups
    VITE_APP_NAME: GoMad
  volumes:
    - ..:/var/www/html
    - vendor:/var/www/html/vendor
    - storage:/var/www/html/storage
    - bootstrap_cache:/var/www/html/bootstrap/cache
    - ../backups:/backups
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:8200:80"
    volumes:
      - ../public:/var/www/html/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    <<: *app
    entrypoint: ["/usr/local/bin/gomad-entrypoint"]
    command: ["php-fpm", "-F"]
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90"]
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-gomad}
      MARIADB_USER: ${DB_USERNAME:-gomad}
      MARIADB_PASSWORD: ${DB_PASSWORD:-gomad-local}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-gomad-root-local}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - database:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/gomad.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:8125:8025"
    restart: unless-stopped

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "127.0.0.1:5273:5173"
    volumes:
      - ..:/var/www/html
      - node_modules:/var/www/html/node_modules
    restart: unless-stopped

volumes:
  bootstrap_cache:
  database:
  node_modules:
  redis:
  storage:
  vendor:
