name: API CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: gomad
          MARIADB_USER: gomad
          MARIADB_PASSWORD: gomad-ci
          MARIADB_ROOT_PASSWORD: root-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_NAME: GoMad
      APP_URL: http://localhost:8200
      API_LOCAL_URL: http://localhost:8200/api
      API_VERSION: 0.0.1
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, intl, pdo_mysql, pdo_sqlite, redis, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: ramsey/composer-install@v3
      - run: npm ci
      - name: Build frontend assets
        run: npm run build
      - name: Check formatting
        run: ./vendor/bin/pint --test
      - name: Run unit, integration, and architecture tests
        run: php artisan test
      - name: Verify clean MySQL migration and seed
        env:
          APP_ENV: local
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: gomad
          DB_USERNAME: gomad
          DB_PASSWORD: gomad-ci
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan migrate:fresh --seed --force
      - name: Check generated API contract
        run: |
          php artisan scramble:export --path=openapi/openapi.yaml
          git diff --exit-code -- openapi/openapi.yaml
      - name: Notify the mobile repository when the API contract changes
        if: github.event_name == 'push'
        env:
          MOBILE_REPOSITORY: gomaddotid-commits/gomad-mobile
          MOBILE_REPOSITORY_TOKEN: ${{ secrets.MOBILE_REPOSITORY_TOKEN }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          if git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null \
              && git diff --quiet "$EVENT_BEFORE" "$EVENT_SHA" -- openapi/openapi.yaml routes/api.php; then
            echo "The API contract did not change."
            exit 0
          fi
          if [[ -z "$MOBILE_REPOSITORY_TOKEN" ]]; then
            echo "Mobile notification is not configured; set the MOBILE_REPOSITORY_TOKEN secret." >&2
            exit 1
          fi
          if (( $(wc -c < openapi/openapi.yaml) > 60000 )); then
            echo "The generated API contract is too large for a repository_dispatch payload." >&2
            exit 1
          fi
          payload="$(jq -n --arg repository "$SOURCE_REPOSITORY" --arg sha "$EVENT_SHA" \
            --rawfile contract openapi/openapi.yaml \
            '{event_type:"gomad-api-contract-updated",client_payload:{api_repository:$repository,contract_sha:$sha,contract_document:$contract}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $MOBILE_REPOSITORY_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/$MOBILE_REPOSITORY/dispatches"
