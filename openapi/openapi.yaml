            "post": {
                "operationId": "v1.auth.mfa.verify",
                "summary": "Menukar kode verifikasi menjadi token akses. Tantangan dicari lewat token\nsementara, bukan lewat identitas, supaya tidak bisa dipakai menebak akun lain",
