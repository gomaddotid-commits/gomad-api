        "/v1/auth/register": {
            "post": {
                "operationId": "v1.auth.register",
                "tags": [
                    "Auth"
                ],
                "requestBody": {
                    "required": true,
                    "content": {
                        "application/json": {
                            "schema": {
                                "type": "object",
                                "properties": {
                                    "name": {
                                        "type": "string",
                                        "minLength": 2,
                                        "maxLength": 120
                                    },
                                    "phone": {
                                        "type": "string",
                                        "maxLength": 30
                                    },
                                    "email": {
                                        "type": [
                                            "string",
                                            "null"
                                        ],
                                        "format": "email",
                                        "maxLength": 255
                                    },
                                    "password": {
                                        "type": "string",
                                        "minLength": 12
                                    },
                                    "account_type": {
                                        "type": [
                                            "string",
                                            "null"
                                        ],
                                        "enum": [
                                            "customer",
                                            "warung_owner",
                                            "grosir_owner",
                                            "agency_owner",
                                            null
                                        ]
                                    },
                                    "password_confirmation": {
                                        "type": "string",
                                        "minLength": 12
                                    }
                                },
                                "required": [
                                    "name",
                                    "phone",
                                    "password",
                                    "password_confirmation"
                                ]
                            }
                        }
                    }
